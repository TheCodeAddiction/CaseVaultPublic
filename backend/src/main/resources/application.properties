spring.application.name=casevault-backend

spring.datasource.url=jdbc:h2:file:./data/casevault;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=9090

casevault.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
casevault.jwt.expiration-minutes=60

casevault.storage.directory=./uploads
casevault.storage.max-file-size-bytes=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
